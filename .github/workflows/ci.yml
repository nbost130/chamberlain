name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  # Every check, the same as `bun run checks` on a laptop: Biome (format, lint, imports, complexity limits),
  # typecheck, knip (dead code), jscpd (duplication) and the tests. About 75 s on a GitHub-hosted runner.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # A slow registry (the 2026-11-09 Cloudflare incident: a 1.4 s install took 36 minutes) fails fast and
      # gets one longer retry, instead of holding the runner until the job limit.
      - id: install
        run: bun install --frozen-lockfile
        timeout-minutes: 4
        continue-on-error: true
      - if: steps.install.outcome == 'failure'
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: bun run checks

  # The same four binaries the release builds, all from one runner. The macOS job below runs the Apple Silicon one.
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - id: install
        run: bun install --frozen-lockfile
        timeout-minutes: 4
        continue-on-error: true
      - if: steps.install.outcome == 'failure'
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: bun scripts/build.ts
      - name: Smoke-test the linux-x64 binary from an empty directory
        run: bun scripts/smoke.ts dist/chamberlain-*-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*.tar.gz
          retention-days: 3

  # Proof that the Apple Silicon binary starts on a Mac: the one built above, run by scripts/smoke.ts from an empty directory.
  macos:
    needs: binaries
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Smoke-test the darwin-arm64 binary
        run: bun scripts/smoke.ts dist/chamberlain-*-darwin-arm64.tar.gz
